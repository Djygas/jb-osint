services:
  api-gateway:
    build: .
    env_file: .env
    expose:
      - "8080"
    volumes:
      - jbdata:/data
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - api-gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped

volumes:
  jbdata:
