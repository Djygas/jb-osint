name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Кэш конфигурации Gradle
        run: chmod +x ./gradlew

      - name: Юнит-тесты ядра отчётов (PDF/XLSX/HTML/CSV)
        run: ./gradlew --no-daemon :report-core:test

      - name: Юнит-тесты приложения
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Lint (ошибки останавливают сборку)
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Публикация отчётов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.txt
            report-core/build/reports/tests/**
          if-no-files-found: ignore

      - name: Debug APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

  # Release собирается только если в секретах репозитория лежит ключ подписи.
  # Как добавить: Settings → Secrets and variables → Actions:
  #   JB_KEYSTORE_BASE64  — base64 от .jks (base64 -w0 keystore.jks)
  #   JB_KEYSTORE_PASSWORD, JB_KEY_ALIAS, JB_KEY_PASSWORD
  release:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Проверка наличия ключа подписи
        id: key
        env:
          JB_KEYSTORE_BASE64: ${{ secrets.JB_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$JB_KEYSTORE_BASE64" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Ключ подписи не задан — release пропущен (собирается локально)."
          else
            echo "$JB_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Release APK
        if: steps.key.outputs.present == 'true'
        env:
          JB_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          JB_KEYSTORE_PASSWORD: ${{ secrets.JB_KEYSTORE_PASSWORD }}
          JB_KEY_ALIAS: ${{ secrets.JB_KEY_ALIAS }}
          JB_KEY_PASSWORD: ${{ secrets.JB_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Release APK как артефакт
        if: steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
