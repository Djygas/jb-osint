name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: ""
      - name: Unit tests
        run: ./gradlew :report-core:test :app:testDebugUnitTest --console=plain
      - name: Lint
        run: ./gradlew :app:lintDebug --console=plain

  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: ""
      - name: Decode release keystore
        id: keystore
        env:
          JB_KEYSTORE_BASE64: ${{ secrets.JB_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$JB_KEYSTORE_BASE64" ]; then
            echo "$JB_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/jbosint-release.jks"
            echo "keystore=$RUNNER_TEMP/jbosint-release.jks" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Assemble release APK
        env:
          JB_KEYSTORE_FILE: ${{ steps.keystore.outputs.keystore }}
          JB_KEYSTORE_PASSWORD: ${{ secrets.JB_KEYSTORE_PASSWORD }}
          JB_KEY_ALIAS: ${{ secrets.JB_KEY_ALIAS }}
          JB_KEY_PASSWORD: ${{ secrets.JB_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --console=plain
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jb-osint-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: jb-osint-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
