# Сборка на общем хосте с ~1.9 ГБ RAM (наш контейнер ~430 МБ держит opencode).
#
# ВАЖНО: прежние «экономные» значения (-Xmx256m -XX:MaxDirectMemorySize=16m) НЕ
# позволяли собрать release вообще:
#   * -Xmx256m  -> minifyReleaseWithR8 падал с java.lang.OutOfMemoryError: Java heap space;
#   * -XX:MaxDirectMemorySize=16m -> packageRelease падал с
#     «Cannot reserve 37899152 bytes of direct buffer memory» (упаковщик mmap-ит
#     libgojni.so на 37.9 МБ).
# Проверенный рабочий набор — ниже (release собирается целиком, см. отчёт по размеру APK).
# На машине с 8–16 ГБ можно вернуть умеренные значения и включить полный режим R8
# (android.enableR8.fullMode=true) — но перепроверить сборку.
org.gradle.jvmargs=-Xmx1100m -XX:MaxMetaspaceSize=320m -XX:CompressedClassSpaceSize=64m -XX:ReservedCodeCacheSize=16m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:-UsePerfData -XX:MaxDirectMemorySize=192m -Xss512k -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.daemon=false
org.gradle.workers.max=1
org.gradle.caching=true
org.gradle.configureondemand=false
org.gradle.vfs.watch=false

kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false
android.suppressUnsupportedCompileSdk=35
kotlin.code.style=official

# Классический режим R8 требует заметно меньше пиковой памяти, чем full mode
# (на хосте ~1.9 ГБ full mode не проходит). Влияет только на оптимизации, не на поведение.
android.enableR8.fullMode=false

# Один воркер R8: на 1.9 ГБ RAM параллельный minify приводит к OOM-kill
android.r8.maxWorkers=1
